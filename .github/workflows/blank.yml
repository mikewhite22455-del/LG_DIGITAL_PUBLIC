name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Decode Release Keystore
        id: decode-keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "keystore_ready=false" >> "$GITHUB_OUTPUT"
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks 2>/dev/null && [ -s app/release.jks ]; then
            echo "keystore_ready=true" >> "$GITHUB_OUTPUT"
          else
            rm -f app/release.jks
            echo "WARNING: KEYSTORE_BASE64 is missing or not valid base64; signed release will be skipped"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-Debug-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"

      - name: Build Signed Release AAB
        if: ${{ steps.decode-keystore.outputs.keystore_ready == 'true' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: gradle bundleRelease

      - name: Upload Signed Play Store AAB
        if: ${{ steps.decode-keystore.outputs.keystore_ready == 'true' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-PlayStore-AAB
          path: "**/build/outputs/bundle/release/app-release.aab"
