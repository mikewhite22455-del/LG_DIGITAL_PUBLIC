name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is missing; the AAB will be unsigned"
            exit 0
          fi
          clean_keystore=$(printf '%s' "$KEYSTORE_BASE64" |
            tr -d '\r\n \t"' |
            sed "s/^'//; s/'$//")
          clean_keystore="${clean_keystore//\\n/}"
          clean_keystore="${clean_keystore//\\r/}"
          if ! printf '%s' "$clean_keystore" | base64 --decode > app/release.jks 2>/dev/null ||
             [ ! -s app/release.jks ]; then
            rm -f app/release.jks
            echo "::warning::KEYSTORE_BASE64 is invalid; the AAB will be unsigned"
            exit 0
          fi
          ls -lh app/release.jks

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-Debug-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-PlayStore-AAB
          path: "**/build/outputs/bundle/release/app-release.aab"
