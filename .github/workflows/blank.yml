name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets"
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 --decode > app/release.jks ||
             [ ! -s app/release.jks ]; then
            echo "::error::KEYSTORE_BASE64 must contain the base64-encoded keystore file"
            exit 1
          fi
          if ! keytool -list -keystore app/release.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::Could not open the keystore with KEYSTORE_PASSWORD and KEY_ALIAS"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-Debug-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -F 'jar verified.'

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-PlayStore-AAB
          path: "**/build/outputs/bundle/release/app-release.aab"
          if-no-files-found: error
