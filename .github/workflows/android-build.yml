name: Android Signed APK & AAB Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 36 & Build Tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore project keystore from debug.keystore.base64
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=LG Digital,O=LG Digital,C=CA"
            fi
          fi

      - name: Prepare optional runtime API secrets (.env)
        shell: bash
        env:
          LG_LIVE_API_TOKEN: ${{ secrets.LG_LIVE_API_TOKEN }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
          KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
          KUCOIN_API_PASSPHRASE: ${{ secrets.KUCOIN_API_PASSPHRASE }}
          BITSTAMP_API_KEY: ${{ secrets.BITSTAMP_API_KEY }}
          BITSTAMP_API_SECRET: ${{ secrets.BITSTAMP_API_SECRET }}
        run: |
          cp .env.example .env
          write_secret() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s=%s\n' "$key" "$val" >> .env
            fi
          }
          write_secret "LG_LIVE_API_TOKEN" "$LG_LIVE_API_TOKEN"
          write_secret "KRAKEN_API_KEY" "$KRAKEN_API_KEY"
          write_secret "KRAKEN_API_SECRET" "$KRAKEN_API_SECRET"
          write_secret "COINBASE_API_KEY" "$COINBASE_API_KEY"
          write_secret "COINBASE_API_SECRET" "$COINBASE_API_SECRET"
          write_secret "KUCOIN_API_KEY" "$KUCOIN_API_KEY"
          write_secret "KUCOIN_API_SECRET" "$KUCOIN_API_SECRET"
          write_secret "KUCOIN_API_PASSPHRASE" "$KUCOIN_API_PASSPHRASE"
          write_secret "BITSTAMP_API_KEY" "$BITSTAMP_API_KEY"
          write_secret "BITSTAMP_API_SECRET" "$BITSTAMP_API_SECRET"

      - name: Assemble Release APK and AAB
        shell: bash
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Sign Release APK & AAB with Keystore Credentials
        id: sign_release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist-release

          RAW_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          RAW_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)"

          if [ -z "$RAW_APK" ] || [ -z "$RAW_AAB" ]; then
            echo "Release APK or AAB output missing." >&2
            exit 1
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Signing release artifacts using GitHub Actions production keystore credentials..."
            KEYSTORE_FILE="$RUNNER_TEMP/release-upload.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$KEYSTORE_FILE"

            BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
            APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

            # Re-align and sign APK with v2/v3 APK Signature Scheme
            cp "$RAW_APK" "$RUNNER_TEMP/unsigned.apk"
            zip -qd "$RUNNER_TEMP/unsigned.apk" "META-INF/*" || true
            "$ZIPALIGN" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out dist-release/LG-Digital-release.apk \
              "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" verify --verbose dist-release/LG-Digital-release.apk > /dev/null

            # Strip previous signature block and sign AAB with production upload key
            cp "$RAW_AAB" dist-release/LG-Digital-release.aab
            zip -qd dist-release/LG-Digital-release.aab "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" "META-INF/*.EC" || true
            jarsigner \
              -keystore "$KEYSTORE_FILE" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              dist-release/LG-Digital-release.aab \
              "$ANDROID_KEY_ALIAS"
            jarsigner -verify dist-release/LG-Digital-release.aab > /dev/null

            echo "signing_mode=Custom Keystore (GitHub Secrets)" >> "$GITHUB_OUTPUT"
          else
            echo "Custom production keystore secrets not set; using bundled project keystore signing."
            cp "$RAW_APK" dist-release/LG-Digital-release.apk
            cp "$RAW_AAB" dist-release/LG-Digital-release.aab
            echo "signing_mode=Project Keystore (debug.keystore.base64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary keystore files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release-upload.keystore" "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk" .env

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-release-apk
          path: dist-release/LG-Digital-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: LG-Digital-release-aab
          path: dist-release/LG-Digital-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Write Build Summary
        shell: bash
        run: |
          APK_SIZE="$(du -h dist-release/LG-Digital-release.apk | cut -f1)"
          AAB_SIZE="$(du -h dist-release/LG-Digital-release.aab | cut -f1)"
          {
            echo "## LG Digital Release Build Complete"
            echo ""
            echo "- **Signing Mode**: ${{ steps.sign_release.outputs.signing_mode }}"
            echo "- **Signed APK**: \`LG-Digital-release.apk\` ($APK_SIZE) — install directly on Android devices"
            echo "- **Signed AAB**: \`LG-Digital-release.aab\` ($AAB_SIZE) — upload directly to Google Play Console"
          } >> "$GITHUB_STEP_SUMMARY"

  compile-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate local debug keystore for release assembly
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LG Digital,O=LG Digital,C=CA"
      - run: gradle :app:assembleRelease --no-daemon
